version: '3.8'

services:
  support_bot:
    build: .
    container_name: tg_support_bot
    volumes:
      - ./shared:/app/shared
    env_file:
      - /Users/ip/IdeaProjects/tg_support_bot/.env.local
    restart: unless-stopped
    user: appuser
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'