[gu]
hello_msg = "નમસ્તે! તમારો પ્રશ્ન, પ્રતિસાદ અથવા સમસ્યાનું વર્ણન મોકલો — અમે તેને જલદી ઉકેલવાનો પ્રયાસ કરીશું."
first_reply = "અમને તમારો સંદેશ મળી ગયો છે. અમે શક્ય તેટલી વહેલી તકે તમને જવાબ આપીશું. કૃપા કરીને ચેટ કાઢી ન નાખો, જેથી અમે તમને જવાબ મોકલી શકીએ."

[ha]
hello_msg = "Sannu! Aika tambayarka, ra'ayinka, ko bayanin matsalar — za mu yi kokarin warware ta ba da jimawa ba."
