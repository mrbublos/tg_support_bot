[nl]
hello_msg = "Hallo! Stuur ons je vraag, feedback of probleembeschrijving — we proberen het snel op te lossen. Gebruik alstublieft tekstberichten in plaats van audio- of spraakberichten."
first_reply = "We hebben je bericht ontvangen. We nemen zo snel mogelijk contact met je op. Verwijder de chat niet, zodat we je een antwoord kunnen sturen."

[no]
hello_msg = "Hei! Send oss spørsmålet ditt, tilbakemelding eller en beskrivelse av problemet — vi prøver å løse det snart. Bruk tekstmeldinger i stedet for lyd- eller talemeldinger."
first_reply = "Vi har mottatt meldingen din. Vi svarer deg så snart vi kan. Ikke slett chatten, slik at vi kan sende deg et svar."

[om]
hello_msg = "Akkam! Gaaffii, yaada deebii, yookaan ibsa rakkoo keessanii nuuf ergaa — dhi soonatti hiikuuf ni yaalla. Maaloo ergaa sagalee yookaan audio irra ergaa barreeffamaa fayyadamaa."
first_reply = "Ergaa keessan arganneerra. Hamma dandeenyetti dafnee deebina. Deebii isiniif erguu akka dandeenyuuf maaloo marii kana hin haqinaa."

[pt]
hello_msg = "Olá! Envie sua pergunta, feedback ou descrição do problema — tentaremos resolver em breve. Por favor, use mensagens de texto em vez de mensagens de áudio ou de voz."
first_reply = "Recebemos sua mensagem. Entraremos em contato assim que possível. Não exclua a conversa para que possamos enviar uma resposta."

[pl]
hello_msg = "Dzień dobry! Wyślij pytanie, opinię albo opis problemu — postaramy się wkrótce to rozwiązać. Prosimy używać wiadomości tekstowych zamiast wiadomości audio lub głosowych."
first_reply = "Otrzymaliśmy Twoją wiadomość. Odpowiemy tak szybko, jak to możliwe. Nie usuwaj czatu, abyśmy mogli wysłać Ci odpowiedź."

[pa]
hello_msg = "ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਆਪਣਾ ਸਵਾਲ, ਫੀਡਬੈਕ ਜਾਂ ਸਮੱਸਿਆ ਦਾ ਵੇਰਵਾ ਭੇਜੋ — ਅਸੀਂ ਇਸਨੂੰ ਜਲਦੀ ਹੱਲ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਾਂਗੇ. ਕਿਰਪਾ ਕਰਕੇ ਆਡੀਓ ਜਾਂ ਵੌਇਸ ਸੁਨੇਹਿਆਂ ਦੀ ਬਜਾਏ ਟੈਕਸਟ ਸੁਨੇਹੇ ਭੇਜੋ।"
first_reply = "ਸਾਨੂੰ ਤੁਹਾਡਾ ਸੁਨੇਹਾ ਮਿਲ ਗਿਆ ਹੈ। ਅਸੀਂ ਜਿੰਨੀ ਜਲਦੀ ਹੋ ਸਕੇ ਤੁਹਾਨੂੰ ਜਵਾਬ ਦੇਵਾਂਗੇ। ਕਿਰਪਾ ਕਰਕੇ ਚੈਟ ਨਾ ਮਿਟਾਓ, ਤਾਂ ਜੋ ਅਸੀਂ ਤੁਹਾਨੂੰ ਜਵਾਬ ਭੇਜ ਸਕੀਏ."

[ro]
hello_msg = "Bună! Trimite-ne întrebarea, feedbackul sau descrierea problemei — vom încerca să o rezolvăm curând. Te rugăm să folosești mesaje text în loc de mesaje audio sau vocale."
first_reply = "Am primit mesajul tău. Îți vom răspunde cât mai curând posibil. Te rugăm să nu ștergi conversația, ca să îți putem trimite un răspuns."

[ru]
hello_msg = "Здравствуйте! Напишите ваш вопрос, отзыв или описание проблемы — постараемся решить её в ближайшее время. Пожалуйста, отправляйте текстовые сообщения вместо аудио или голосовых сообщений."
first_reply = "Мы получили ваше сообщение. Мы ответим вам как можно скорее. Пожалуйста, не удаляйте чат, чтобы мы могли отправить вам ответ."

[sk]
hello_msg = "Dobrý deň! Pošlite nám otázku, spätnú väzbu alebo opis problému — pokúsime sa ho čoskoro vyriešiť. Prosím používajte textové správy namiesto audio alebo hlasových správ."
first_reply = "Dostali sme vašu správu. Ozveme sa vám čo najskôr. Prosím, nemažte chat, aby sme vám mohli poslať odpoveď."

[sl]
hello_msg = "Pozdravljeni! Pošljite vprašanje, povratno informacijo ali opis težave — potrudili se bomo, da jo kmalu rešimo. Prosimo, uporabljajte besedilna sporočila namesto zvočnih ali glasovnih sporočil."
first_reply = "Prejeli smo vaše sporočilo. Odgovorili vam bomo takoj, ko bo mogoče. Prosimo, ne izbrišite klepeta, da vam bomo lahko poslali odgovor."

[sr]
hello_msg = "Здраво! Пошаљите питање, повратну информацију или опис проблема — потрудићемо се да га ускоро решимо. Молимо вас да користите текстуалне поруке уместо аудио или гласовних порука."
first_reply = "Примили смо вашу поруку. Одговорићемо вам што је пре могуће. Молимо вас да не бришете чет како бисмо могли да вам пошаљемо одговор."

[sv]
hello_msg = "Hej! Skicka din fråga, feedback eller problembeskrivning — vi försöker lösa det snart. Använd gärna textmeddelanden i stället för ljud- eller röstmeddelanden."
first_reply = "Vi har tagit emot ditt meddelande. Vi återkommer till dig så snart vi kan. Radera inte chatten så att vi kan skicka ett svar till dig."

[ta]
hello_msg = "வணக்கம்! உங்கள் கேள்வி, கருத்து அல்லது பிரச்சினையின் விளக்கத்தை அனுப்புங்கள் — அதை விரைவில் தீர்க்க முயற்சிப்போம். தயவுசெய்து ஆடியோ அல்லது குரல் செய்திகளுக்குப் பதிலாக உரைச் செய்திகளைப் பயன்படுத்துங்கள்."
first_reply = "உங்கள் செய்தியை பெற்றுள்ளோம். முடிந்தவரை விரைவில் உங்களைத் தொடர்புகொள்வோம். பதில் அனுப்ப முடியும் வகையில் தயவுசெய்து உரையாடலை நீக்க வேண்டாம்."

[te]
hello_msg = "నమస్తే! మీ ప్రశ్న, అభిప్రాయం లేదా సమస్య వివరణను పంపండి — దాన్ని త్వరలో పరిష్కరించడానికి ప్రయత్నిస్తాము. దయచేసి ఆడియో లేదా వాయిస్ సందేశాల బదులుగా టెక్స్ట్ సందేశాలను ఉపయోగించండి."
first_reply = "మీ సందేశం మాకు అందింది. వీలైనంత త్వరగా మీకు సమాధానం ఇస్తాము. మీకు ప్రత్యుత్తరం పంపడానికి వీలుగా దయచేసి చాట్‌ను తొలగించవద్దు."

[tg]
hello_msg = "Салом! Савол, фикру мулоҳиза ё тавсифи мушкили худро фиристед — кӯшиш мекунем онро ба зудӣ ҳал кунем. Лутфан ба ҷои паёмҳои аудиоӣ ё овозӣ паёмҳои матнӣ фиристед."
first_reply = "Паёми шуморо гирифтем. Ҳарчи зудтар ба шумо ҷавоб медиҳем. Лутфан чатро нест накунед, то тавонем ба шумо ҷавоб фиристем."

[ti]
hello_msg = "ሰላም! ሕቶኹም፣ ርእይቶኹም ወይ መግለጺ ጸገምኩም ስደዱልና — ቀልጢፍና ክንፈትሖ ክንፍትን ኢና. በጃኹም ኣብ ክንዲ ናይ ኦዲዮ ወይ ናይ ድምጺ መልእኽቲ፣ ናይ ጽሑፍ መልእኽቲ ተጠቐሙ።"
first_reply = "መልእኽትኹም ተቐቢልናዮ ኣለና። ብዝተኻእለ ቅልጡፍ መልሲ ክንህበኩም ኢና። መልሲ ክንሰደልኩም ክንክእል በጃኹም ነቲ ዝርርብ ኣይትደምስሱ."

[tl]
hello_msg = "Kumusta! Ipadala ang iyong tanong, feedback, o paglalarawan ng problema — susubukan naming ayusin ito sa lalong madaling panahon. Mangyaring gumamit ng text message sa halip na audio o voice message."
first_reply = "Natanggap namin ang iyong mensahe. Babalikan ka namin sa lalong madaling panahon. Huwag burahin ang chat para makapagpadala kami sa iyo ng sagot."

[tr]
hello_msg = "Merhaba! Sorunuzu, geri bildiriminizi veya sorun açıklamanızı gönderin — yakında çözmeye çalışacağız. Lütfen sesli veya audio mesajlar yerine yazılı mesaj kullanın."
