first_reply = "ਸਾਨੂੰ ਤੁਹਾਡਾ ਸੁਨੇਹਾ ਮਿਲ ਗਿਆ ਹੈ। ਅਸੀਂ ਜਿੰਨੀ ਜਲਦੀ ਹੋ ਸਕੇ ਤੁਹਾਨੂੰ ਜਵਾਬ ਦੇਵਾਂਗੇ। ਕਿਰਪਾ ਕਰਕੇ ਚੈਟ ਨਾ ਮਿਟਾਓ, ਤਾਂ ਜੋ ਅਸੀਂ ਤੁਹਾਨੂੰ ਜਵਾਬ ਭੇਜ ਸਕੀਏ."

[ro]
