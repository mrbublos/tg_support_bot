[kn]
hello_msg = "ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಪ್ರಶ್ನೆ, ಪ್ರತಿಕ್ರಿಯೆ ಅಥವಾ ಸಮಸ್ಯೆಯ ವಿವರಣೆಯನ್ನು ಕಳುಹಿಸಿ — ಅದನ್ನು ಶೀಘ್ರದಲ್ಲೇ ಪರಿಹರಿಸಲು ಪ್ರಯತ್ನಿಸುತ್ತೇವೆ."
