[default]
hello_msg = "Hello! Please send us your question, feedback, or problem description — we'll try to resolve it soon. Please use text messages instead of audio or voice messages."
first_reply = "We have received your message. We'll get back to you as soon as we can. Please don't delete the chat so we can send you a reply."

[ar]
hello_msg = "مرحبًا! أرسل سؤالك أو ملاحظتك أو وصف المشكلة — سنحاول حلها قريبًا. يرجى استخدام الرسائل النصية بدلًا من الرسائل الصوتية أو التسجيلات الصوتية."
first_reply = "لقد استلمنا رسالتك. سنعود إليك في أقرب وقت ممكن. من فضلك لا تحذف المحادثة حتى نتمكن من إرسال الرد إليك."

[ar_001]
hello_msg = "مرحبًا! أرسل سؤالك أو ملاحظتك أو وصف المشكلة — سنحاول حلها قريبًا. يرجى استخدام الرسائل النصية بدلًا من الرسائل الصوتية أو التسجيلات الصوتية."
first_reply = "لقد استلمنا رسالتك. سنعود إليك في أقرب وقت ممكن. من فضلك لا تحذف المحادثة حتى نتمكن من إرسال الرد إليك."

[am]
hello_msg = "ሰላም! ጥያቄዎን፣ አስተያየትዎን ወይም የችግሩን መግለጫ ይላኩልን — በቅርቡ ለመፍታት እንሞክራለን. እባክዎ ከድምጽ ወይም ከኦዲዮ መልዕክቶች ይልቅ የጽሑፍ መልዕክቶችን ይጠቀሙ።"
first_reply = "መልዕክትዎን ተቀብለናል። በተቻለ ፍጥነት እንመልስልዎታለን። መልስ ልንልክልዎ እንድንችል እባክዎ ውይይቱን አይሰርዙ."

[az]
hello_msg = "Salam! Sualınızı, rəyinizi və ya problemin təsvirini göndərin — tezliklə həll etməyə çalışacağıq. Zəhmət olmasa audio və ya səsli mesajlar əvəzinə mətn mesajları göndərin."
first_reply = "Mesajınızı aldıq. Sizə mümkün qədər tez cavab verəcəyik. Cavab göndərə bilməyimiz üçün xahiş edirik çatı silməyin."

[be]
hello_msg = "Вітаем! Напішыце ваша пытанне, водгук або апісанне праблемы — пастараемся вырашыць яе ў бліжэйшы час. Калі ласка, выкарыстоўвайце тэкставыя паведамленні замест аўдыя або галасавых паведамленняў."
first_reply = "Мы атрымалі ваша паведамленне. Мы адкажам вам як мага хутчэй. Калі ласка, не выдаляйце чат, каб мы маглі даслаць вам адказ."

[bn]
hello_msg = "হ্যালো! আপনার প্রশ্ন, মতামত বা সমস্যার বিবরণ পাঠান — আমরা দ্রুত সমাধানের চেষ্টা করব। অনুগ্রহ করে অডিও বা ভয়েস মেসেজের বদলে টেক্সট মেসেজ ব্যবহার করুন।"
first_reply = "আমরা আপনার বার্তা পেয়েছি। যত দ্রুত সম্ভব আমরা আপনার সাথে যোগাযোগ করব। অনুগ্রহ করে চ্যাটটি মুছে ফেলবেন না, যাতে আমরা আপনাকে উত্তর পাঠাতে পারি।"

[bg]
hello_msg = "Здравейте! Изпратете въпрос, обратна връзка или описание на проблема — ще се постараем да го решим скоро. Моля, използвайте текстови съобщения вместо аудио или гласови съобщения."
first_reply = "Получихме вашето съобщение. Ще се свържем с вас възможно най-скоро. Моля, не изтривайте чата, за да можем да ви изпратим отговор."

[bs]
hello_msg = "Zdravo! Pošaljite pitanje, povratnu informaciju ili opis problema — potrudit ćemo se to uskoro riješiti. Molimo koristite tekstualne poruke umjesto audio ili glasovnih poruka."
first_reply = "Primili smo vašu poruku. Javit ćemo vam se što je prije moguće. Molimo vas da ne brišete chat kako bismo vam mogli poslati odgovor."

[cs]
hello_msg = "Dobrý den! Pošlete nám svůj dotaz, zpětnou vazbu nebo popis problému — pokusíme se ho brzy vyřešit. Prosím používejte textové zprávy místo audio nebo hlasových zpráv."
first_reply = "Obdrželi jsme vaši zprávu. Ozveme se vám co nejdříve. Prosím nemažte chat, abychom vám mohli poslat odpověď."

[de]
hello_msg = "Hallo! Sende uns deine Frage, dein Feedback oder eine Problembeschreibung — wir versuchen, es bald zu lösen. Bitte sende Textnachrichten statt Audio- oder Sprachnachrichten."
first_reply = "Wir haben deine Nachricht erhalten. Wir melden uns so schnell wie möglich bei dir. Bitte lösche den Chat nicht, damit wir dir antworten können."

[da]
hello_msg = "Hej! Send os dit spørgsmål, feedback eller en beskrivelse af problemet — vi forsøger at løse det snart. Brug venligst tekstbeskeder i stedet for lyd- eller talebeskeder."
first_reply = "Vi har modtaget din besked. Vi vender tilbage til dig så hurtigt som muligt. Slet venligst ikke chatten, så vi kan sende dig et svar."

[en]
hello_msg = "Hello! Please send us your question, feedback, or problem description — we'll try to resolve it soon. Please use text messages instead of audio or voice messages."
first_reply = "We have received your message. We'll get back to you as soon as we can. Please don't delete the chat so we can send you a reply."

[es]
hello_msg = "¡Hola! Envíanos tu pregunta, comentario o descripción del problema — intentaremos resolverlo pronto. Por favor, usa mensajes de texto en lugar de mensajes de audio o de voz."
first_reply = "Hemos recibido tu mensaje. Te responderemos lo antes posible. No elimines el chat para que podamos enviarte una respuesta."

[fi]
hello_msg = "Hei! Lähetä kysymyksesi, palautteesi tai ongelman kuvaus — yritämme ratkaista sen pian. Käytäthän tekstiviestejä ääni- tai puheviestien sijaan."
first_reply = "Olemme vastaanottaneet viestisi. Palaamme sinulle mahdollisimman pian. Älä poista keskustelua, jotta voimme lähettää sinulle vastauksen."

[fr]
hello_msg = "Bonjour ! Envoyez-nous votre question, votre avis ou la description du problème — nous essaierons de le résoudre rapidement. Merci d’utiliser des messages texte plutôt que des messages audio ou vocaux."
first_reply = "Nous avons bien reçu votre message. Nous vous répondrons dès que possible. Merci de ne pas supprimer la conversation afin que nous puissions vous répondre."

[fil]
hello_msg = "Kumusta! Ipadala ang iyong tanong, feedback, o paglalarawan ng problema — susubukan naming ayusin ito sa lalong madaling panahon. Mangyaring gumamit ng text message sa halip na audio o voice message."
first_reply = "Natanggap namin ang iyong mensahe. Babalikan ka namin sa lalong madaling panahon. Huwag burahin ang chat para makapagpadala kami sa iyo ng sagot."

[gu]
hello_msg = "નમસ્તે! તમારો પ્રશ્ન, પ્રતિસાદ અથવા સમસ્યાનું વર્ણન મોકલો — અમે તેને જલદી ઉકેલવાનો પ્રયાસ કરીશું. કૃપા કરીને ઑડિયો અથવા વૉઇસ મેસેજને બદલે ટેક્સ્ટ મેસેજનો ઉપયોગ કરો."
first_reply = "અમને તમારો સંદેશ મળી ગયો છે. અમે શક્ય તેટલી વહેલી તકે તમને જવાબ આપીશું. કૃપા કરીને ચેટ કાઢી ન નાખો, જેથી અમે તમને જવાબ મોકલી શકીએ."

[ha]
hello_msg = "Sannu! Aika tambayarka, ra'ayinka, ko bayanin matsalar — za mu yi kokarin warware ta ba da jimawa ba. Don Allah ka yi amfani da saƙonnin rubutu maimakon saƙonnin sauti ko na murya."
first_reply = "Mun karbi sakonka. Za mu tuntube ka da wuri-wuri. Don Allah kada ka goge hirar domin mu iya aiko maka da amsa."

[he]
hello_msg = "שלום! שלחו שאלה, משוב או תיאור של הבעיה — נשתדל לפתור זאת בקרוב. אנא השתמשו בהודעות טקסט במקום הודעות אודיו או הודעות קוליות."
first_reply = "קיבלנו את ההודעה שלכם. נחזור אליכם בהקדם האפשרי. נא לא למחוק את הצ'אט כדי שנוכל לשלוח לכם תשובה."

[hi]
hello_msg = "नमस्ते! अपना सवाल, प्रतिक्रिया या समस्या का विवरण भेजें — हम इसे जल्द हल करने की कोशिश करेंगे. कृपया ऑडियो या वॉइस मैसेज के बजाय टेक्स्ट मैसेज भेजें।"
first_reply = "हमें आपका संदेश मिल गया है। हम जल्द से जल्द आपसे संपर्क करेंगे। कृपया चैट डिलीट न करें, ताकि हम आपको जवाब भेज सकें."

[hr]
hello_msg = "Pozdrav! Pošaljite pitanje, povratnu informaciju ili opis problema — potrudit ćemo se to uskoro riješiti. Molimo koristite tekstualne poruke umjesto audio ili glasovnih poruka."
first_reply = "Primili smo vašu poruku. Javit ćemo vam se čim prije. Nemojte izbrisati chat kako bismo vam mogli poslati odgovor."

[hy]
hello_msg = "Բարև։ Ուղարկեք ձեր հարցը, կարծիքը կամ խնդրի նկարագրությունը — կփորձենք շուտով լուծել այն։ Խնդրում ենք օգտագործել տեքստային հաղորդագրություններ՝ աուդիո կամ ձայնային հաղորդագրությունների փոխարեն։"
first_reply = "Մենք ստացել ենք ձեր հաղորդագրությունը։ Կպատասխանենք որքան հնարավոր է շուտ։ Խնդրում ենք չջնջել զրույցը, որպեսզի կարողանանք ձեզ պատասխան ուղարկել։"

[hu]
hello_msg = "Üdvözöljük! Küldje el kérdését, visszajelzését vagy a probléma leírását — igyekszünk hamar megoldani. Kérjük, hang- vagy audiouzenetek helyett szöveges üzeneteket használjon."
first_reply = "Megkaptuk az üzenetét. A lehető leghamarabb válaszolunk. Kérjük, ne törölje a csevegést, hogy el tudjuk küldeni a választ."

[ig]
hello_msg = "Ndewo! Ziga ajụjụ gị, nzaghachi gị, ma ọ bụ nkọwa nsogbu ahụ — anyị ga-agbalị idozi ya n'oge na-adịghị anya. Biko jiri ozi ederede kama ozi audio ma ọ bụ ozi olu."
first_reply = "Anyị anatala ozi gị. Anyị ga-aza gị ozugbo o kwere omume. Biko ehichapụla mkparịta ụka ahụ ka anyị nwee ike izitere gị azịza."

[is]
hello_msg = "Halló! Sendu okkur spurningu, ábendingu eða lýsingu á vandamálinu — við reynum að leysa það fljótlega. Vinsamlegast notaðu textaskilaboð í stað hljóð- eða raddskilaboða."
first_reply = "Við höfum móttekið skilaboðin þín. Við svörum þér eins fljótt og auðið er. Vinsamlegast ekki eyða spjallinu svo við getum sent þér svar."

[ga]
hello_msg = "Dia dhuit! Seol do cheist, aiseolas nó cur síos ar an bhfadhb — déanfaimid iarracht é a réiteach go luath. Úsáid teachtaireachtaí téacs le do thoil in ionad teachtaireachtaí fuaime nó gutha."
first_reply = "Tá do theachtaireacht faighte againn. Rachaimid i dteagmháil leat chomh luath agus is féidir. Ná scrios an comhrá, le do thoil, ionas gur féidir linn freagra a sheoladh chugat."

[it]
hello_msg = "Ciao! Inviaci la tua domanda, il tuo feedback o la descrizione del problema — cercheremo di risolverlo presto. Per favore usa messaggi di testo invece di messaggi audio o vocali."
first_reply = "Abbiamo ricevuto il tuo messaggio. Ti risponderemo il prima possibile. Non eliminare la chat, così potremo inviarti una risposta."

[kk]
hello_msg = "Сәлеметсіз бе! Сұрағыңызды, пікіріңізді немесе мәселенің сипаттамасын жіберіңіз — оны жақын арада шешуге тырысамыз. Аудио немесе дауыстық хабарламалардың орнына мәтіндік хабарламалар жіберіңіз."
first_reply = "Хабарламаңызды алдық. Сізге мүмкіндігінше тез жауап береміз. Жауап жібере алуымыз үшін чатты өшірмеңіз."

[kn]
hello_msg = "ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಪ್ರಶ್ನೆ, ಪ್ರತಿಕ್ರಿಯೆ ಅಥವಾ ಸಮಸ್ಯೆಯ ವಿವರಣೆಯನ್ನು ಕಳುಹಿಸಿ — ಅದನ್ನು ಶೀಘ್ರದಲ್ಲೇ ಪರಿಹರಿಸಲು ಪ್ರಯತ್ನಿಸುತ್ತೇವೆ. ದಯವಿಟ್ಟು ಆಡಿಯೋ ಅಥವಾ ಧ್ವನಿ ಸಂದೇಶಗಳ ಬದಲು ಪಠ್ಯ ಸಂದೇಶಗಳನ್ನು ಬಳಸಿ."
first_reply = "ನಿಮ್ಮ ಸಂದೇಶವನ್ನು ನಾವು ಸ್ವೀಕರಿಸಿದ್ದೇವೆ. ಸಾಧ್ಯವಾದಷ್ಟು ಬೇಗ ನಿಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸುತ್ತೇವೆ. ನಿಮಗೆ ಉತ್ತರ ಕಳುಹಿಸಲು ಸಾಧ್ಯವಾಗಲು ದಯವಿಟ್ಟು ಚಾಟ್ ಅಳಿಸಬೇಡಿ."

[ky]
hello_msg = "Салам! Сурооңузду, пикириңизди же көйгөйдүн сүрөттөмөсүн жөнөтүңүз — аны жакында чечүүгө аракет кылабыз. Аудио же үн билдирүүлөрдүн ордуна текст билдирүүлөрүн колдонуңуз."
first_reply = "Билдирүүңүздү алдык. Сизге мүмкүн болушунча тез жооп беребиз. Жооп жөнөтө алышыбыз үчүн чатты өчүрбөңүз."

[lb]
hello_msg = "Moien! Schéck eis deng Fro, däi Feedback oder eng Beschreiwung vum Problem — mir probéieren et geschwënn ze léisen. Benotz w.e.g. Textnoriichten amplaz Audio- oder Stëmmnoriichten."
first_reply = "Mir hunn deng Noriicht kritt. Mir mellen eis esou séier wéi méiglech zeréck. Läscht w.e.g. de Chat net, fir datt mir dir eng Äntwert schécke kënnen."

[lt]
hello_msg = "Sveiki! Atsiųskite klausimą, atsiliepimą arba problemos aprašymą — pasistengsime tai greitai išspręsti. Prašome naudoti tekstines žinutes vietoje garso ar balso pranešimų."
first_reply = "Gavome jūsų žinutę. Susisieksime su jumis kaip įmanoma greičiau. Prašome neištrinti pokalbio, kad galėtume atsiųsti jums atsakymą."

[lv]
hello_msg = "Sveiki! Nosūtiet savu jautājumu, atsauksmi vai problēmas aprakstu — centīsimies to drīz atrisināt. Lūdzu, izmantojiet teksta ziņas, nevis audio vai balss ziņas."
first_reply = "Mēs saņēmām jūsu ziņojumu. Atbildēsim jums, cik drīz vien iespējams. Lūdzu, neizdzēsiet čatu, lai mēs varētu nosūtīt jums atbildi."

[ml]
hello_msg = "ഹലോ! നിങ്ങളുടെ ചോദ്യം, അഭിപ്രായം അല്ലെങ്കിൽ പ്രശ്നത്തിന്റെ വിവരണം അയയ്ക്കൂ — അത് ഉടൻ പരിഹരിക്കാൻ ഞങ്ങൾ ശ്രമിക്കും. ദയവായി ഓഡിയോ അല്ലെങ്കിൽ വോയ്സ് സന്ദേശങ്ങൾക്ക് പകരം ടെക്സ്റ്റ് സന്ദേശങ്ങൾ ഉപയോഗിക്കുക."
first_reply = "നിങ്ങളുടെ സന്ദേശം ഞങ്ങൾക്ക് ലഭിച്ചു. കഴിയുന്നത്ര വേഗത്തിൽ ഞങ്ങൾ മറുപടി നൽകും. നിങ്ങൾക്ക് മറുപടി അയയ്ക്കാൻ കഴിയുന്നതിനായി ദയവായി ചാറ്റ് ഇല്ലാതാക്കരുത്."

[mk]
hello_msg = "Здраво! Испратете прашање, повратна информација или опис на проблемот — ќе се обидеме да го решиме наскоро. Ве молиме користете текстуални пораки наместо аудио или гласовни пораки."
first_reply = "Ја добивме вашата порака. Ќе ви одговориме што е можно поскоро. Ве молиме не го бришете разговорот за да можеме да ви испратиме одговор."

[mr]
hello_msg = "नमस्कार! तुमचा प्रश्न, अभिप्राय किंवा समस्येचे वर्णन पाठवा — आम्ही ते लवकर सोडवण्याचा प्रयत्न करू. कृपया ऑडिओ किंवा व्हॉइस मेसेजऐवजी टेक्स्ट मेसेज पाठवा."
