[sr]
hello_msg = "Здраво! Пошаљите питање, повратну информацију или опис проблема — потрудићемо се да га ускоро решимо."
first_reply = "Примили смо вашу поруку. Одговорићемо вам што је пре могуће. Молимо вас да не бришете чет како бисмо могли да вам пошаљемо одговор."

[sv]
hello_msg = "Hej! Skicka din fråga, feedback eller problembeskrivning — vi försöker lösa det snart."
first_reply = "Vi har tagit emot ditt meddelande. Vi återkommer till dig så snart vi kan. Radera inte chatten så att vi kan skicka ett svar till dig."

[ta]
hello_msg = "வணக்கம்! உங்கள் கேள்வி, கருத்து அல்லது பிரச்சினையின் விளக்கத்தை அனுப்புங்கள் — அதை விரைவில் தீர்க்க முயற்சிப்போம்."
first_reply = "உங்கள் செய்தியை பெற்றுள்ளோம். முடிந்தவரை விரைவில் உங்களைத் தொடர்புகொள்வோம். பதில் அனுப்ப முடியும் வகையில் தயவுசெய்து உரையாடலை நீக்க வேண்டாம்."

[te]
hello_msg = "నమస్తే! మీ ప్రశ్న, అభిప్రాయం లేదా సమస్య వివరణను పంపండి — దాన్ని త్వరలో పరిష్కరించడానికి ప్రయత్నిస్తాము."
first_reply = "మీ సందేశం మాకు అందింది. వీలైనంత త్వరగా మీకు సమాధానం ఇస్తాము. మీకు ప్రత్యుత్తరం పంపడానికి వీలుగా దయచేసి చాట్‌ను తొలగించవద్దు."

[tg]
hello_msg = "Салом! Савол, фикру мулоҳиза ё тавсифи мушкили худро фиристед — кӯшиш мекунем онро ба зудӣ ҳал кунем."
first_reply = "Паёми шуморо гирифтем. Ҳарчи зудтар ба шумо ҷавоб медиҳем. Лутфан чатро нест накунед, то тавонем ба шумо ҷавоб фиристем."

[ti]
hello_msg = "ሰላም! ሕቶኹም፣ ርእይቶኹም ወይ መግለጺ ጸገምኩም ስደዱልና — ቀልጢፍና ክንፈትሖ ክንፍትን ኢና."
first_reply = "መልእኽትኹም ተቐቢልናዮ ኣለና። ብዝተኻእለ ቅልጡፍ መልሲ ክንህበኩም ኢና። መልሲ ክንሰደልኩም ክንክእል በጃኹም ነቲ ዝርርብ ኣይትደምስሱ."

[tl]
hello_msg = "Kumusta! Ipadala ang iyong tanong, feedback, o paglalarawan ng problema — susubukan naming ayusin ito sa lalong madaling panahon."
first_reply = "Natanggap namin ang iyong mensahe. Babalikan ka namin sa lalong madaling panahon. Huwag burahin ang chat para makapagpadala kami sa iyo ng sagot."

[tr]
hello_msg = "Merhaba! Sorunuzu, geri bildiriminizi veya sorun açıklamanızı gönderin — yakında çözmeye çalışacağız."
first_reply = "Mesajınızı aldık. Size mümkün olan en kısa sürede geri döneceğiz. Size yanıt gönderebilmemiz için lütfen sohbeti silmeyin."

[uk]
hello_msg = "Вітаємо! Напишіть ваше питання, відгук або опис проблеми — постараємося вирішити її найближчим часом."
first_reply = "Ми отримали ваше повідомлення. Ми відповімо вам якнайшвидше. Будь ласка, не видаляйте чат, щоб ми могли надіслати вам відповідь."

[ur]
hello_msg = "ہیلو! اپنا سوال، رائے یا مسئلے کی تفصیل بھیجیں — ہم اسے جلد حل کرنے کی کوشش کریں گے۔"
first_reply = "ہمیں آپ کا پیغام موصول ہو گیا ہے۔ ہم جلد از جلد آپ سے رابطہ کریں گے۔ براہ کرم چیٹ حذف نہ کریں تاکہ ہم آپ کو جواب بھیج سکیں۔"

[uz]
hello_msg = "Salom! Savolingiz, fikr-mulohazangiz yoki muammo tavsifini yuboring — uni tez orada hal qilishga harakat qilamiz."
first_reply = "Xabaringizni oldik. Sizga imkon qadar tezroq javob beramiz. Javob yubora olishimiz uchun chatni o'chirmang."

[vi]
hello_msg = "Xin chào! Hãy gửi câu hỏi, phản hồi hoặc mô tả vấn đề của bạn — chúng tôi sẽ cố gắng giải quyết sớm."
first_reply = "Chúng tôi đã nhận được tin nhắn của bạn. Chúng tôi sẽ phản hồi sớm nhất có thể. Vui lòng không xóa cuộc trò chuyện để chúng tôi có thể gửi câu trả lời cho bạn."

[yo]
hello_msg = "Bawo! Fi ibeere, esi, tabi apejuwe iṣoro rẹ ranṣẹ — a o gbiyanju lati yanju rẹ laipẹ."
first_reply = "A ti gba ifiranṣẹ rẹ. A o kan si ọ ni kete bi a ti le ṣe. Jọwọ maṣe pa iwiregbe naa rẹ ki a le fi idahun ranṣẹ si ọ."

[zh]
hello_msg = "你好！请发送你的问题、反馈或问题描述 — 我们会尽快尝试解决。"
first_reply = "我们已收到你的消息。我们会尽快回复你。请不要删除聊天，以便我们向你发送回复。"
