first_reply = "Vi har modtaget din besked. Vi vender tilbage til dig så hurtigt som muligt. Slet venligst ikke chatten, så vi kan sende dig et svar."

[en]
hello_msg = "Hello! Please send us your question, feedback, or problem description — we'll try to resolve it soon."
first_reply = "We have received your message. We'll get back to you as soon as we can. Please don't delete the chat so we can send you a reply."

[es]
