[az]
hello_msg = "Salam! Sualınızı, rəyinizi və ya problemin təsvirini göndərin — tezliklə həll etməyə çalışacağıq."
first_reply = "Mesajınızı aldıq. Sizə mümkün qədər tez cavab verəcəyik. Cavab göndərə bilməyimiz üçün xahiş edirik çatı silməyin."

[be]
hello_msg = "Вітаем! Напішыце ваша пытанне, водгук або апісанне праблемы — пастараемся вырашыць яе ў бліжэйшы час."
