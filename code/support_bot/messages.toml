first_reply = "Obdrželi jsme vaši zprávu. Ozveme se vám co nejdříve. Prosím nemažte chat, abychom vám mohli poslat odpověď."

[de]
hello_msg = "Hallo! Sende uns deine Frage, dein Feedback oder eine Problembeschreibung — wir versuchen, es bald zu lösen."
