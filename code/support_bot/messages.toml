[ur]
hello_msg = "ہیلو! اپنا سوال، رائے یا مسئلے کی تفصیل بھیجیں — ہم اسے جلد حل کرنے کی کوشش کریں گے۔ براہ کرم آڈیو یا وائس میسجز کے بجائے ٹیکسٹ میسجز استعمال کریں۔"
first_reply = "ہمیں آپ کا پیغام موصول ہو گیا ہے۔ ہم جلد از جلد آپ سے رابطہ کریں گے۔ براہ کرم چیٹ حذف نہ کریں تاکہ ہم آپ کو جواب بھیج سکیں۔"

[uz]
hello_msg = "Salom! Savolingiz, fikr-mulohazangiz yoki muammo tavsifini yuboring — uni tez orada hal qilishga harakat qilamiz. Iltimos, audio yoki ovozli xabarlar o‘rniga matnli xabarlar yuboring."
first_reply = "Xabaringizni oldik. Sizga imkon qadar tezroq javob beramiz. Javob yubora olishimiz uchun chatni o'chirmang."

[vi]
hello_msg = "Xin chào! Hãy gửi câu hỏi, phản hồi hoặc mô tả vấn đề của bạn — chúng tôi sẽ cố gắng giải quyết sớm. Vui lòng dùng tin nhắn văn bản thay vì tin nhắn âm thanh hoặc tin nhắn thoại."
first_reply = "Chúng tôi đã nhận được tin nhắn của bạn. Chúng tôi sẽ phản hồi sớm nhất có thể. Vui lòng không xóa cuộc trò chuyện để chúng tôi có thể gửi câu trả lời cho bạn."

[yo]
hello_msg = "Bawo! Fi ibeere, esi, tabi apejuwe iṣoro rẹ ranṣẹ — a o gbiyanju lati yanju rẹ laipẹ. Jọwọ lo ifiranṣẹ ọrọ dipo ifiranṣẹ ohun tabi ifiranṣẹ ohùn."
first_reply = "A ti gba ifiranṣẹ rẹ. A o kan si ọ ni kete bi a ti le ṣe. Jọwọ maṣe pa iwiregbe naa rẹ ki a le fi idahun ranṣẹ si ọ."

[zh]
hello_msg = "你好！请发送你的问题、反馈或问题描述 — 我们会尽快尝试解决。 请使用文字消息，不要发送音频或语音消息。"
first_reply = "我们已收到你的消息。我们会尽快回复你。请不要删除聊天，以便我们向你发送回复。"
