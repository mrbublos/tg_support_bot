[mr]
hello_msg = "नमस्कार! तुमचा प्रश्न, अभिप्राय किंवा समस्येचे वर्णन पाठवा — आम्ही ते लवकर सोडवण्याचा प्रयत्न करू."
first_reply = "आम्हाला तुमचा संदेश मिळाला आहे. आम्ही शक्य तितक्या लवकर तुम्हाला उत्तर देऊ. कृपया चॅट हटवू नका, जेणेकरून आम्ही तुम्हाला उत्तर पाठवू शकू."

[ms]
